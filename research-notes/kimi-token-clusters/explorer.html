<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kimi K3 token embeddings: interactive ICA community explorer</title>
<link rel="stylesheet" href="/style.css">
<script>var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }
  main {
    width: min(1500px, 100%);
    max-width: none;
    margin: 0 auto;
    padding: 24px;
  }
  h1 {
    margin: 0 0 6px;
    font-family: 'Lora', Georgia, serif;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 600;
  }
  .lede {
    max-width: 1050px;
    margin: 0 0 20px;
    color: var(--text-muted);
    font-size: 0.92rem;
    line-height: 1.6;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
    gap: 20px;
    align-items: start;
  }
  .heatmap-card, .details {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .heatmap-card { padding: 12px; }
  .dendrogram {
    display: block;
    width: 100%;
    height: auto;
    margin-bottom: 4px;
  }
  .tree-label {
    margin: 0 0 3px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .community-band {
    display: flex;
    width: 100%;
    height: 24px;
    margin-bottom: 5px;
    overflow: hidden;
    border-radius: 5px;
  }
  .community-band span {
    min-width: 1px;
    overflow: hidden;
    border-right: 1px solid white;
    color: #26394b;
    font: 10px/24px ui-monospace, SFMono-Regular, monospace;
    text-align: center;
  }
  .community-band span:nth-child(6n+1) { background: #c6dbef; }
  .community-band span:nth-child(6n+2) { background: #9ecae1; }
  .community-band span:nth-child(6n+3) { background: #6baed6; }
  .community-band span:nth-child(6n+4) { background: #bdd7e7; }
  .community-band span:nth-child(6n+5) { background: #74a9cf; }
  .community-band span:nth-child(6n) { background: #a6bddb; }
  .heatmap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: #f7fbff;
    cursor: crosshair;
    user-select: none;
    touch-action: none;
  }
  .heatmap img {
    display: block;
    width: 100%;
    height: 100%;
  }
  .heatmap canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .axis {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    color: var(--text-muted);
    font: 12px ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .details {
    position: sticky;
    top: 16px;
    padding: 18px;
    min-height: 260px;
  }
  .eyebrow {
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .component {
    margin: 5px 0 2px;
    font: 700 clamp(24px, 4vw, 36px) ui-monospace, SFMono-Regular, monospace;
  }
  .meta { margin: 0 0 18px; color: var(--text-muted); }
  #community-label-zh, #community-label-en {
    display: block;
    margin-top: 4px;
    color: var(--text);
  }
  #community-label-zh { font-size: 16px; font-weight: 650; }
  #community-label-en { font-size: 13px; }
  .tokens {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .token {
    max-width: 100%;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    padding: 5px 8px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: 14px ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .hint { margin: 18px 0 0; color: var(--text-muted); font-size: 13px; }
  @media (max-width: 850px) {
    main { padding: 14px; }
    .layout { grid-template-columns: 1fr; }
    .details { position: static; }
  }
</style>
</head>

      <div class="tokens" id="tokens"></div>

    </aside>
  </div>
</main>

const heatmap = document.getElementById("heatmap");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");
let selected = null;

function resizeOverlay() {
  const scale = window.devicePixelRatio || 1;
  const rect = heatmap.getBoundingClientRect();
  overlay.width = Math.round(rect.width * scale);
  overlay.height = Math.round(rect.height * scale);
  drawSelection();
}

function drawSelection() {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (selected === null) return;
  const x = (selected + 0.5) / rows.length * overlay.width;
  ctx.strokeStyle =
    getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()
    || "#c9705a";
  ctx.lineWidth = Math.max(1.5, window.devicePixelRatio || 1);
  ctx.beginPath();
  ctx.moveTo(x, 0);
  ctx.lineTo(x, overlay.height);
  ctx.stroke();
}

function selectColumn(index) {
  selected = Math.max(0, Math.min(rows.length - 1, index));
  const row = rows[selected];
  document.getElementById("position").textContent = row.position - 1;
  document.getElementById("component").textContent = row.component;
  document.getElementById("objective").textContent = row.objective.toFixed(2);
  const communityLine = document.getElementById("community-line");
  communityLine.hidden = !row.community;
  if (row.community) {
    document.getElementById("community").textContent = row.community;
    document.getElementById("community-label-zh").textContent =
      row.community_label_zh || "";
    document.getElementById("community-label-en").textContent =
      row.community_label_en || "";
  }
  const tokenBox = document.getElementById("tokens");
  tokenBox.replaceChildren(...row.tokens.map(text => {
    const token = document.createElement("span");
    token.className = "token";
    token.textContent = text;
    return token;
  }));
  drawSelection();
}

function columnAtEvent(event) {
  const rect = heatmap.getBoundingClientRect();
  return Math.floor((event.clientX - rect.left) / rect.width * rows.length);
}

overlay.addEventListener(
  "pointerdown",
  event => selectColumn(columnAtEvent(event)),
);
new ResizeObserver(resizeOverlay).observe(heatmap);
selectColumn(0);
</script>
